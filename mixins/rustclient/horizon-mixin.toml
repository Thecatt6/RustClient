[mod]
id = "rustclient"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[[crate]]
id = "core"
path = "core"
dependent = "horizon-client"

[[injection]]
id = "register"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "register.rs"
bindings = [{ name = "mods", ty = "&mut Vec<NativeMod>", value = "mods" }]

[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "buttons" },
]

[[injection]]
id = "settings-click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "settings_click.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
